<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
  <meta name="robots" content="noindex, nofollow">
  <title>Kard Radar</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div class="app" id="app" hidden>
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".35"/><circle cx="16" cy="16" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".6"/><path d="M16 16 L27 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="22.5" cy="11.2" r="2.4" fill="var(--electric)"/></svg></span>
        <span class="brand-text"><span class="brand-name">Kard Radar</span><span class="brand-sub">Kal's Digital</span></span>
      </a>
      <nav class="nav" id="nav">
        <a href="#/" data-route="dashboard"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zm0 7h6v-5H4zm10 0h6v-9h-6zm0-16v5h6V4z"/></svg><span>Dashboard</span></a>
        <a href="#/today" data-route="today"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6-4.5-4.2 6.1-.7z"/></svg><span>Today's 20</span></a>
        <a href="#/leads" data-route="leads"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Leads</span></a>
        <a href="#/discover" data-route="discover"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><span>Find leads</span></a>
        <a href="#/new" data-route="new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Add lead</span></a>
        <a href="#/data" data-route="data"><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14"/></svg><span>Import / export</span></a>
        <a href="#/settings" data-route="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9l2.1 2.1m10 10l2.1 2.1M4.9 19.1L7 17m10-10l2.1-2.1"/></svg><span>Strategy</span></a>
      </nav>
      <div class="sidebar-foot">
        <button class="btn-ghost small" id="theme-toggle" type="button" aria-label="Toggle colour theme">Theme</button>
        <button class="btn-ghost small" id="logout" type="button">Sign out</button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <a class="brand compact" href="#/" aria-label="Kard Radar home">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".35"/><circle cx="16" cy="16" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".6"/><path d="M16 16 L27 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="22.5" cy="11.2" r="2.4" fill="var(--electric)"/></svg></span>
          <span class="brand-name">Kard Radar</span>
        </a>
        <form class="search" id="global-search" role="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
          <input type="search" name="q" placeholder="Search leads, handles, domains…" aria-label="Search leads" autocomplete="off">
        </form>
        <a class="btn primary small hide-sm" href="#/new">+ Add lead</a>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
    <nav class="tabbar" aria-label="Mobile navigation">
      <a href="#/" data-route="dashboard"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zm0 7h6v-5H4zm10 0h6v-9h-6zm0-16v5h6V4z"/></svg><span>Home</span></a>
      <a href="#/today" data-route="today"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6-4.5-4.2 6.1-.7z"/></svg><span>Today</span></a>
      <a href="#/leads" data-route="leads"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Leads</span></a>
      <a href="#/discover" data-route="discover"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><span>Find</span></a>
      <a href="#/more" data-route="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>More</span></a>
    </nav>
  </div>
  <div id="login-root"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
</body>
</html>
